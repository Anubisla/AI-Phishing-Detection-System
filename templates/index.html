<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based Phishing Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI-Based Phishing Detection System</h1>

        <p class="subtitle">
            Check whether a URL is safe or suspicious.
        </p>

        <form method="POST">

            <input
                type="text"
                name="url"
                placeholder="Enter website URL"
                required>

            <button type="submit">
                Check URL
            </button>

        </form>
        {% if prediction %}
        <div class="result">
            <h2>{{ prediction }}</h2>
            {% if confidence %}
            <p class="confidence">Confidence: {{ confidence }}%</p>
            {% endif %}
        </div>
        {% endif %}

        

    </div>

</body>

</html>
